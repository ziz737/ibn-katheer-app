<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>مشاريع الطلاب - ابن كثير ببريدة</title>
<meta name="theme-color" content="#0d9488">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مشاريع ابن كثير">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest-index.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',system-ui,sans-serif}
html,body{height:100%;background:#0d9488}
iframe#app{position:fixed;inset:0;width:100%;height:100dvh;border:none;background:#f8fafc}
#instUI{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px;background:transparent;pointer-events:none}
#instUI.hide{display:none}
.inst-card{pointer-events:auto;position:relative}
#instX{position:absolute;top:10px;left:10px;background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;color:#64748b}
.inst-card{background:#fff;border-radius:24px;max-width:400px;width:100%;padding:32px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.inst-card img.logo{width:84px;height:84px;border-radius:22px;object-fit:cover;margin:0 auto 14px;border:3px solid #ccfbf1}
.inst-card h1{font-size:19px;font-weight:900;color:#0f172a}
.inst-card p{font-size:13.5px;color:#475569;margin:8px 0 20px;line-height:1.9}
#instBtn{display:none;width:100%;background:linear-gradient(135deg,#0d9488,#0891b2);color:#fff;border:none;border-radius:14px;font-family:inherit;font-weight:900;font-size:16px;padding:15px;cursor:pointer;box-shadow:0 4px 16px rgba(13,148,136,.35)}
#instBtn.show{display:block}
.open-link{display:block;margin-top:12px;font-size:13.5px;font-weight:800;color:#0d9488;text-decoration:none}
.ios-hint{display:none;margin-top:14px;font-size:12.5px;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;line-height:2}
.ios-hint.show{display:block}
@media (display-mode: standalone){#instUI{display:none}}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbznSg31btyy_YvgfO6Xigy_DQvV2i6aHgUcW10nMCD7BqGPf4W1TXSL5kLByO2oVxn0aA/exec" title="منصة مشاريع الطلاب" allow="camera; microphone; geolocation"></iframe>
<div id="instUI">
  <div class="inst-card">
    <button id="instX" aria-label="إغلاق">✕</button>
    <img class="logo" src="./icons/icon-192.png" alt="شعار المنصة">
    <h1>مشاريع الطلاب 📚</h1>
    <p>متوسطة ابن كثير ببريدة — 1448 هـ<br>ثبّت التطبيق على جوالك لوصول سريع من الشاشة الرئيسية</p>
    <button id="instBtn">📲 تثبيت التطبيق الآن</button>
    <div class="ios-hint" id="iosHint">للتثبيت على الآيفون: اضغط زر <b>المشاركة ⎙</b> ثم <b>«إضافة إلى الشاشة الرئيسية»</b></div>
    <button class="open-link" id="openApp" style="background:none;border:none;cursor:pointer;width:100%">تصفح المنصة بدون تثبيت ←</button>
  </div>
</div>
<script>
(function(){
  var APP_URL = 'https://script.google.com/macros/s/AKfycbznSg31btyy_YvgfO6Xigy_DQvV2i6aHgUcW10nMCD7BqGPf4W1TXSL5kLByO2oVxn0aA/exec';
  var dPrompt = null, done = false;
  function isStand(){ try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }catch(x){ return false; } }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }
  function hide(){ var u = document.getElementById('instUI'); if(u) u.classList.add('hide'); }
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(function(){}); }
  if(isStand()){ hide(); return; }
  if(isIOS()){ document.getElementById('iosHint').classList.add('show'); }
  document.getElementById('openApp').addEventListener('click', function(){ hide(); });
  document.getElementById('instX').addEventListener('click', function(){ hide(); });
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); dPrompt = e;
    var b = document.getElementById('instBtn'); b.classList.add('show');
    setTimeout(function(){ if(!done && dPrompt){ done = true; dPrompt.prompt(); dPrompt.userChoice.then(function(){ dPrompt = null; }); } }, 1500);
  });
  document.getElementById('instBtn').addEventListener('click', function(){
    if(dPrompt){ done = true; dPrompt.prompt(); dPrompt.userChoice.then(function(c){ if(c && c.outcome === 'accepted') hide(); dPrompt = null; }); }
  });
  window.addEventListener('appinstalled', hide);
})();
</script>
</body>
</html>
